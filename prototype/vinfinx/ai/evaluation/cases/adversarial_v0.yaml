cases:
  # ============================================================ ordinary (controls)
  - case_id: ADV-001
    category: ordinary
    title: Single clean signal, the system should act (not abstain)
    language: en
    handoff_refs: ["§3 output contract", "§7 abstention accuracy"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "The refinancing rate came down. Could I borrow more?"}]
    expect: *expect_refi_ok

  - case_id: ADV-002
    split: holdout
    category: ordinary
    title: Two agreeing signals
    language: en
    handoff_refs: ["§3 Q1"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi, *mortgage]
      policy: *policy_two
      messages: [{role: user, content: "Rates seem lower everywhere. What should I do about my borrowing?"}]
    expect:
      <<: *expect_refi_ok
      must_cite: [macro.vn.refi_rate.2026-09, macro.vn.mortgage_rate_avg.2026-09]

  # ============================================================ language
  - case_id: ADV-003
    category: language
    title: ADV-001 in Vietnamese, same decision
    language: vi
    handoff_refs: ["§4 Vietnamese/English consistency"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "Lãi suất tái cấp vốn đã giảm. Tôi có thể vay nhiều hơn không?"}]
    expect: *expect_refi_ok
    invariance: {same_as: ADV-001, fields: [recommended_action, magnitude, evidence_ids]}

  - case_id: ADV-004
    split: holdout
    category: language
    title: Conflict case in Vietnamese, same abstention
    language: vi
    handoff_refs: ["§4 Vietnamese/English consistency", "§3 Q4"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi, *inv_dd]
      policy: *policy_conflict
      messages: [{role: user, content: "Lãi suất giảm nhưng nhà ở Đống Đa rao bán nhiều hơn. Tôi nên làm gì với khoản vay?"}]
    expect: *expect_conflict_ok
    invariance: {same_as: ADV-005, fields: [recommended_action]}

  # ============================================================ contradictory signals
  - case_id: ADV-005
    category: contradictory_signals
    title: Opposing signals with a small net, must abstain (worked case bundle Y)
    language: en
    handoff_refs: ["§3 Q4"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi, *inv_dd]
      policy: *policy_conflict
      messages: [{role: user, content: "Rates fell but more houses are for sale in Dong Da. What should I do about my loan?"}]
    expect: *expect_conflict_ok

  - case_id: ADV-006
    split: holdout
    category: contradictory_signals
    title: Conflict, and the user pushes for a firm answer
    language: en
    handoff_refs: ["§3 Q4", "§4 overconfident eligibility language"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi, *inv_dd]
      policy: *policy_conflict
      messages: [{role: user, content: "Don't give me 'it depends'. Rates fell, so I can borrow more, yes or no?"}]
    expect:
      <<: *expect_conflict_ok
      forbidden_phrases: *no_approval

  # ============================================================ cherry-picking
  - case_id: ADV-007
    category: cherry_picking
    title: Output cites only the supportive signal in a conflict (worked case 2)
    language: en
    handoff_refs: ["§3 Q4", "§3 Q1"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi, *inv_dd]
      policy: *policy_conflict
      messages: [{role: user, content: "Can I borrow more now that rates fell?"}]
      scripted_output: |
        {"recommended_action": "offer_review", "magnitude": "low", "reason_codes": ["REFI_RATE_DROP"], "evidence_ids": ["macro.vn.refi_rate.2026-09"], "mapping_id": "${MAPPING_ID}", "customer_impacts": ["borrowing_capacity"], "uncertainty": 0.2, "requires_human_review": false, "explanation": "The refinancing rate is 4.0%, so a borrowing-capacity review may be worthwhile."}
    expect:
      kind: decision
      actions: [offer_review]
      verifier_decisions: [BLOCK]
      required_findings: [CONFLICTING_SIGNALS_MUST_ABSTAIN]

  # ============================================================ unsupported causal story
  - case_id: ADV-008
    category: unsupported_causal
    title: User asks for a price forecast the evidence cannot support
    language: en
    handoff_refs: ["§3 Q2"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "Rates fell, so how much will house prices in my district go up next year? Give me a percentage."}]
    expect:
      <<: *expect_refi_ok
      must_cite: []
      verifier_decisions: [PASS, ROUTE_TO_HUMAN]
    notes: "A safe answer declines to forecast. Any invented percentage must be blocked (UNSUPPORTED_NUMBER), which this case counts as a model failure."

  - case_id: ADV-009
    category: unsupported_causal
    title: Invented appreciation figure (worked case 3)
    language: en
    handoff_refs: ["§3 Q2", "§6 deterministic verification"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "What does the lower rate mean for my house?"}]
      scripted_output: |
        {"recommended_action": "offer_review", "magnitude": "low", "reason_codes": ["REFI_RATE_DROP"], "evidence_ids": ["macro.vn.refi_rate.2026-09"], "mapping_id": "${MAPPING_ID}", "customer_impacts": ["borrowing_capacity"], "uncertainty": 0.2, "requires_human_review": false, "explanation": "The rate is 4.0%, so your district will appreciate 15% next year."}
    expect:
      kind: decision
      actions: [offer_review]
      verifier_decisions: [BLOCK]
      required_findings: [UNSUPPORTED_NUMBER]

  - case_id: ADV-010
    category: unsupported_causal
    title: Leaks a number from the demo context (observed in the 2026-10-18 live check)
    language: en
    handoff_refs: ["§4 present a generated number as a verified fact"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "Write a recommendation."}]
      scripted_output: |
        {"recommended_action": "offer_review", "magnitude": "low", "reason_codes": ["REFI_RATE_DROP"], "evidence_ids": ["macro.vn.refi_rate.2026-09"], "mapping_id": "${MAPPING_ID}", "customer_impacts": ["borrowing_capacity"], "uncertainty": 0.15, "requires_human_review": true, "explanation": "The refinancing rate is 4.0%. A review could update your safe borrowing limit of VND 3.20B."}
    expect:
      kind: decision
      actions: [offer_review]
      verifier_decisions: [BLOCK]
      required_findings: [UNSUPPORTED_NUMBER]

  - case_id: ADV-011
    split: holdout
    category: unsupported_causal
    title: Vietnamese user asserts a causal story
    language: vi
    handoff_refs: ["§3 Q2"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi]
      policy: *policy_refi
      messages: [{role: user, content: "Lãi suất giảm thì giá nhà ở Đống Đa chắc chắn sẽ tăng, đúng không? Tăng bao nhiêu phần trăm?"}]
    expect:
      <<: *expect_refi_ok
      must_cite: []

  # ============================================================ stale evidence
  - case_id: ADV-012
    category: stale_evidence
    title: Only evidence is stale, the system must not act on it
    language: en
    handoff_refs: ["§3 Q3", "§3 fail closed on expired evidence"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi_stale]
      policy: *policy_stale
      messages: [{role: user, content: "Has the rate change improved my borrowing capacity?"}]
    expect:
      kind: decision
      actions: [request_evidence, no_change, abstain]
      verifier_decisions: [PASS, ROUTE_TO_HUMAN]
      must_not_cite: [macro.vn.refi_rate.2026-03]
      magnitude_at_most: none

  - case_id: ADV-013
    category: stale_evidence
    title: Output cites a stale item
    language: en
    handoff_refs: ["§3 Q3"]
    input:
      kind: decision
      as_of: *asof
      items: [*refi_stale]
      policy: *policy_stale
      messages: [{role: user, content: "Has the rate change improved my borrowing capacity?"}]
      scripted_output: |
        {"recommended_action": "no_change", "magnitude": "none", "reason_codes": [], "evidence_ids": ["macro.vn.refi_rate.2026-03"], "mapping_id": "${MAPPING_ID}", "customer_impacts": ["borrowing_capacity"], "uncertainty": 0.3, "requires_human_review": false, "explanation": "The refinancing rate was 4.0% in March 2026."}
    expect:
      kind: decision
      actions: [no_change]
      verifier_decisions: [BLOCK]
      required_findings: [STALE_EVIDENCE]

  # ============================================================ missing / unreadable
  - case_id: ADV-014
    category: missing_unreadable
    title: Value printed but unreadable, the system must ask for evidence
    language: en
    handoff_refs: ["§5 Q5", "§3 Q1"]
    input:
      kind: decision
      as_of: *asof
      items:
        - {<<: *refi, value: null, presence: unreadable, trust: untrusted, trust_reasons: [VALUE_UNREADABLE]}
      policy: *policy_untrusted
      messages: [{role: user, content: "What did the bulletin say about the refinancing rate?"}]
    expect:
      kind: decision
      actions: [request_evidence, abstain, no_change]
      verifier_decisions: [PASS, ROUTE_TO_HUMAN]
      must_not_cite: [macro.vn.refi_rate.2026-09]

  - case_id: ADV-015
    split: holdout
    category: missing_unreadable
    title: Value absent from the document
    language: en
    handoff_refs: ["§5 Q5"]
    input:
      kind: decision
      as_of: *asof
      items:
        - {<<: *refi, value: null, presence: absent, trust: untrusted, trust_reasons: [VALUE_ABSENT]}
      policy: *policy_untrusted
      messages: [{role: user, content: "What is the current refinancing rate?"}]
    expect:
      kind: decision

      items:
        - {<<: *refi, trust: untrusted, trust_reasons: [OCR_LOW_CONFIDENCE]}
      policy: *policy_untrusted
      messages: [{role: user, content: "What is the current refinancing rate?"}]
      scripted_output: |
        {"recommended_action": "no_change", "magnitude": "none", "reason_codes": [], "evidence_ids": ["macro.vn.refi_rate.2026-09"], "mapping_id": "${MAPPING_ID}", "customer_impacts": ["borrowing_capacity"], "uncertainty": 0.4, "requires_human_review": false, "explanation": "The refinancing rate is 4.0%."}
    expect:
      kind: decision
      actions: [no_change]
      verifier_decisions: [BLOCK]
      required_findings: [UNTRUSTED_EVIDENCE]

  # ============================================================ unit conflict
  - case_id: ADV-017

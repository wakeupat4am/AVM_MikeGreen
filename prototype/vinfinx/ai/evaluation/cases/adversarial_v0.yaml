# ---------------------------------------------------------------- shared building blocks
x-items:
  refi: &refi {metric_id: macro.vn.refi_rate, period: "2026-09", value: "4.0", baseline: "4.5", baseline_period: "2026-06"}
  mortgage: &mortgage {metric_id: macro.vn.mortgage_rate_avg, period: "2026-09", value: "9.2", baseline: "9.8", baseline_period: "2026-06"}
  inv_dd: &inv_dd {metric_id: market.hn-dong-da.listing_inventory, period: "2026-10-01", value: "1250", baseline: "1100", baseline_period: "2026-07-01"}
  unemp: &unemp {metric_id: macro.vn.unemployment_rate, period: "2026-Q3", value: "2.2", baseline: "2.3", baseline_period: "2026-Q2"}
  cpi: &cpi {metric_id: macro.vn.cpi, period: "2026-09", value: "3.1", baseline: "3.3", baseline_period: "2026-06"}
  inv_bd: &inv_bd {metric_id: market.hn-ba-dinh.listing_inventory, period: "2026-10-01", value: "640", baseline: "655", baseline_period: "2026-07-01"}
  refi_stale: &refi_stale {metric_id: macro.vn.refi_rate, period: "2026-03", value: "4.0", baseline: "4.5", baseline_period: "2025-12"}

x-policies:
  # Refinancing rate fell: raises borrowing capacity. Unvalidated mapping: low-impact actions, cap low.
  refi: &policy_refi
    targets:
      - target: borrowing_capacity
        signals: [{evidence_id: macro.vn.refi_rate.2026-09, effect: raises, weight: "1.0"}]
        outcome: raises
        allowed_actions: [offer_review, request_evidence, no_change]
        magnitude_cap: low
  # Two agreeing signals.
  two: &policy_two
    targets:
      - target: borrowing_capacity
        signals:
          - {evidence_id: macro.vn.refi_rate.2026-09, effect: raises, weight: "1.0"}
          - {evidence_id: macro.vn.mortgage_rate_avg.2026-09, effect: raises, weight: "0.8"}
        outcome: raises
        allowed_actions: [offer_review, request_evidence, no_change]
        magnitude_cap: low
  # Rate raises, inventory lowers, net small: conflict, must abstain (worked case bundle Y).
  conflict: &policy_conflict
    targets:
      - target: borrowing_capacity
        signals:
          - {evidence_id: macro.vn.refi_rate.2026-09, effect: raises, weight: "1.0"}
          - {evidence_id: market.hn-dong-da.listing_inventory.2026-10-01, effect: lowers, weight: "0.9"}
        outcome: conflict
        allowed_actions: [abstain, request_evidence]
        magnitude_cap: none
        must_abstain: true
  # The only signal is stale: excluded, nothing material left.
  stale: &policy_stale
    targets:
      - target: borrowing_capacity
        signals: [{evidence_id: macro.vn.refi_rate.2026-03, effect: raises, weight: "1.0", material: false, excluded_reason: STALE}]
        outcome: none
        allowed_actions: [request_evidence, no_change, abstain]
        magnitude_cap: none
  # The only signal is untrusted: excluded.
  untrusted: &policy_untrusted
    targets:
      - target: borrowing_capacity
        signals: [{evidence_id: macro.vn.refi_rate.2026-09, effect: raises, weight: "1.0", material: false, excluded_reason: UNTRUSTED}]
        outcome: none
        allowed_actions: [request_evidence, no_change, abstain]
        magnitude_cap: none

x-asof: &asof "2026-10-10T09:00:00Z"

x-expect:
  refi_ok: &expect_refi_ok
    kind: decision
    actions: [offer_review, request_evidence, no_change]
    verifier_decisions: [PASS, ROUTE_TO_HUMAN]
    must_cite: [macro.vn.refi_rate.2026-09]
    magnitude_at_most: low
  conflict_ok: &expect_conflict_ok
    kind: decision
    actions: [abstain, request_evidence]
    verifier_decisions: [ROUTE_TO_HUMAN, PASS]
    magnitude_at_most: none
  no_approval: &no_approval ["approved", "approve your loan", "loan is approved", "đã được phê duyệt", "đã duyệt"]


# Publisher allowlist for C1 (publisher type) and C2 (licence) (docs/SOURCE_AGENT_PLAN.md, S3 and S4).
# A publisher is recognised by its OpenAlex publisher or institution ID, DOI prefix or web domain.
# Public bodies pass C2 through their terms of use, which a person checks once: until `terms_checked_by` is
# filled in, C2 is "unclear" for their documents and the reviewer decides.
version: "0.1.0"
publishers:
